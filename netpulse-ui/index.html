<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2216%22 fill=%22%232563eb%22/><text y=%22.9em%22 font-size=%2272%22 x=%2250%22 text-anchor=%22middle%22>N</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NeTPulse - Real-time network monitoring dashboard" />
    <title>NeTPulse - Network Monitor</title>

    <!-- Apply dark mode BEFORE React loads to prevent white flash -->
    <script>
      (function() {
        var stored = localStorage.getItem('netpulse_dark')
        var isDark = stored !== null
          ? stored === 'true'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (isDark) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
